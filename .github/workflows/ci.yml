name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PLUGIN_PATH: app/Vito/Plugins/Pietervanleuven/VitodeployBunny

jobs:
  code-style:
    name: Code style (Pint)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: ./vendor/bin/pint --test

  vito:
    name: Tests and static analysis (Vito ${{ matrix.vito-ref }})
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned release: this is what the plugin is verified against.
          - vito-ref: "4.1.1"
            experimental: false
          # Moving branch: early warning for upstream changes.
          - vito-ref: "4.x"
            experimental: true

    steps:
      - name: Checkout plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: plugin

      - name: Checkout VitoDeploy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: vitodeploy/vito
          ref: ${{ matrix.vito-ref }}
          path: vito

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: ftp, intl, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: vito/vendor
          key: composer-${{ runner.os }}-${{ matrix.vito-ref }}-${{ hashFiles('vito/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.vito-ref }}-

      - name: Install VitoDeploy dependencies
        working-directory: vito
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install the plugin into VitoDeploy
        run: |
          mkdir -p "vito/${PLUGIN_PATH}"
          rsync -a --exclude .git --exclude vendor plugin/ "vito/${PLUGIN_PATH}/"

      - name: Prepare the application
        working-directory: vito
        run: |
          touch .env
          php artisan key:generate
          touch storage/database-test.sqlite

      - name: Static analysis (PHPStan)
        working-directory: vito
        run: ./vendor/bin/phpstan analyse -c "${PLUGIN_PATH}/phpstan.neon" --no-progress --memory-limit=1G

      - name: Run tests
        working-directory: vito
        run: php artisan test "${PLUGIN_PATH}/tests"

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download actionlint
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12

      - name: Check workflows
        run: ./actionlint -color
